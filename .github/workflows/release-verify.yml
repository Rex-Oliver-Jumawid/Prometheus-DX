name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      VITE_API_BASE_URL: /api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Install Firefox and WebKit
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Cross-browser E2E
        run: pnpm test:e2e:cross-browser
