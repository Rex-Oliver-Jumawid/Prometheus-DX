name: CI

on:
  push:
    branches: [main, fix/security-ci-push-maintenance]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      VITE_API_BASE_URL: /api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project configuration
        run: pnpm project:doctor

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and service tests
        run: pnpm test

      - name: Component tests
        run: pnpm test:ui

      - name: Production build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium browser smoke test
        run: pnpm test:e2e

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGPASSWORD: postgres
      RUN_DATABASE_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Create Supabase browser roles
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL

      - name: Apply production migrations
        run: pnpm prisma:migrate:deploy

      - name: All PostgreSQL integration suites
        run: pnpm exec vitest run $(find server -name '*.integration.test.ts') --maxWorkers=1 --minWorkers=1

  authenticated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_AUTHENTICATED_E2E: '1'
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Start disposable Supabase
        run: |
          supabase init
          supabase start
          supabase status -o env > /tmp/prometheus-supabase.env
          node scripts/ci-supabase-env.mjs /tmp/prometheus-supabase.env >> "$GITHUB_ENV"
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate:deploy
      - name: Provision isolated authenticated member
        run: pnpm exec tsx scripts/ci-auth-member.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Authenticated Chromium journeys
        run: pnpm exec playwright test --project=chromium --max-failures=10 --retries=0
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-diagnostics
          path: test-results/
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
